<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data: https:;">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vera Browser</title>
<style>
:root{color-scheme:dark;font-family:Inter,Segoe UI,Arial,sans-serif;background:#10131b;color:#f4f6fb}
*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% -20%,#28344a 0,#10131b 58%)}
.toolbar{height:66px;display:flex;align-items:center;gap:9px;padding:10px 16px;background:#171c27;border-bottom:1px solid #303849}
.brand{font-weight:750;letter-spacing:.4px;padding:0 10px 0 2px;color:#f7f8fc}
button{height:38px;min-width:38px;border:1px solid #384254;background:#222a38;color:#e9edf6;border-radius:12px;font-size:17px;cursor:pointer}
button:hover{background:#303b4e}.address-wrap{display:flex;flex:1;gap:8px}
input{width:100%;height:40px;border:1px solid #3a4558;border-radius:14px;background:#0f141e;color:#f4f6fb;padding:0 15px;font-size:14px;outline:none}
input:focus{border-color:#8ca9d8}.go{padding:0 17px;font-size:13px;font-weight:650}
#view{flex:1;width:100%;border:0;background:#fff}
.home{flex:1;display:flex;align-items:center;justify-content:center;padding:30px}
.home-inner{width:min(680px,100%);text-align:center;margin-top:-6vh}
.logo{font-size:64px;font-weight:800;letter-spacing:-4px;margin-bottom:6px;background:linear-gradient(120deg,#fff,#a8b9d7);background-clip:text;color:transparent}
.tag{color:#9ba8bc;margin-bottom:30px}.home-search{display:flex;gap:8px}
.hint{color:#78869d;font-size:12px;margin-top:20px}
.hidden{display:none!important}
</style>
</head>
<body>
<header class="toolbar">
  <div class="brand">Vera</div>
  <button id="back" title="Back" aria-label="Back">‹</button>
  <button id="forward" title="Forward" aria-label="Forward">›</button>
  <button id="reload" title="Reload" aria-label="Reload">↻</button>
  <button id="home" title="Home" aria-label="Home">⌂</button>
  <div class="address-wrap"><input id="address" autocomplete="url" spellcheck="false" placeholder="Search or enter website address"><button class="go" id="go">Go</button></div>
</header>
<main id="homePage" class="home">
  <div class="home-inner">
    <div class="logo">Vera</div>
    <div class="tag">A calmer way to browse.</div>
    <div class="home-search"><input id="homeAddress" placeholder="Search the web or enter an address"><button class="go" id="homeGo">Search</button></div>
    <div class="hint">Private, focused browsing · Powered by DuckDuckGo</div>
  </div>
</main>
<webview id="view" class="hidden" src="about:blank" partition="persist:vera" allowpopups="false"></webview>
<script>
const view=document.getElementById('view'), homePage=document.getElementById('homePage');
const address=document.getElementById('address'), homeAddress=document.getElementById('homeAddress');
let current='';
function target(value){
  const raw=String(value||'').trim(); if(!raw)return '';
  if(/^https?:\/\//i.test(raw))return raw;
  if(/^(localhost|127\.0\.0\.1)(:\d+)?([/].*)?$/i.test(raw)||/^[\w-]+(\.[\w-]+)+(:\d+)?([/].*)?$/i.test(raw))return 'https://'+raw;
  return 'https://duckduckgo.com/?q='+encodeURIComponent(raw);
}
function navigate(value){const url=target(value);if(!url)return;current=url;address.value=url;homePage.classList.add('hidden');view.classList.remove('hidden');view.loadURL(url);}
function go(){navigate(address.value)} function searchHome(){navigate(homeAddress.value)}
document.getElementById('go').addEventListener('click',go);
document.getElementById('homeGo').addEventListener('click',searchHome);
[address,homeAddress].forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter'){el===address?go():searchHome()}}));
document.getElementById('back').addEventListener('click',()=>{if(!view.classList.contains('hidden')&&view.canGoBack())view.goBack()});
document.getElementById('forward').addEventListener('click',()=>{if(!view.classList.contains('hidden')&&view.canGoForward())view.goForward()});
document.getElementById('reload').addEventListener('click',()=>{if(!view.classList.contains('hidden'))view.reload()});
document.getElementById('home').addEventListener('click',()=>{view.classList.add('hidden');homePage.classList.remove('hidden');address.value='';homeAddress.focus()});
view.addEventListener('did-navigate',e=>{address.value=e.url;current=e.url});
view.addEventListener('did-navigate-in-page',e=>{address.value=e.url;current=e.url});
view.addEventListener('new-window',e=>navigate(e.url));
</script>
</body>
</html>
