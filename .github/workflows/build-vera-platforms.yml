name: Vera Android and Windows Builds

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build when you're ready
        required: true
        type: choice
        default: android
        options:
          - android
          - windows

permissions:
  contents: read

jobs:
  build-android:
    name: Build Vera Android APK
    if: ${{ inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Verify Android app configuration
        run: |
          test -f app.json
          test -f App.js
          node -e "const c=require('./app.json').expo; if(!c.android?.package) throw new Error('Missing Android package name')"
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Generate app icon
        run: npx --yes sharp-cli -i assets/icon.svg -o assets/icon.png resize 1024 1024
      - name: Set Android build number
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'app.json';
          const c = JSON.parse(fs.readFileSync(p, 'utf8'));
          c.expo.android = { ...c.expo.android, versionCode: Number(process.env.BUILD_NUMBER) };
          fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
          NODE
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Vera-Android-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Vera Windows EXE
    if: ${{ inputs.platform == 'windows' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check for Windows desktop project
        shell: pwsh
        run: |
          if (-not (Test-Path "desktop/package.json")) {
            Write-Error "The Vera repository does not yet contain desktop/package.json. The current source is an Expo mobile app; add the Vera Windows/Electron desktop project before an EXE can be built."
            exit 1
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Vera-Windows-EXE
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14
