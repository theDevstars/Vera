name: Build Vera IPA, APK and EXE

concurrency:
  group: vera-build-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    paths:
      - "app.json"
      - "App.js"
      - "package.json"
      - "assets/**"
      - "desktop/**"
      - ".github/workflows/build-vera.yml"

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS IPA (unsigned)
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify app configuration
        run: |
          test -f app.json || { echo "app.json is missing"; exit 1; }
          test -f App.js || { echo "App.js is missing"; exit 1; }
          node -e "const c=require('./app.json').expo; if(!c.ios?.bundleIdentifier) throw new Error('ios.bundleIdentifier is missing in app.json')"
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Generate Vera app icon PNG
        run: npx --yes sharp-cli -i assets/icon.svg -o assets/icon.png resize 1024 1024
      - name: Set native app version
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'app.json';
          const config = JSON.parse(fs.readFileSync(p, 'utf8'));
          const build = process.env.BUILD_NUMBER;
          config.expo.version = '1.0.' + build;
          config.expo.ios = { ...config.expo.ios, buildNumber: String(build) };
          config.expo.android = { ...config.expo.android, versionCode: Number(build) };
          fs.writeFileSync(p, JSON.stringify(config, null, 2) + '\n');
          NODE
      - name: Generate iOS project
        run: npx expo prebuild --platform ios --non-interactive --no-install
      - name: Install CocoaPods dependencies
        working-directory: ios
        timeout-minutes: 20
        run: pod install
      - name: Build iOS app
        run: |
          cd ios
          WORKSPACE=$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)
          if [ -z "$WORKSPACE" ]; then echo "No Xcode workspace found"; ls -la; exit 1; fi
          LIST_JSON=$(xcodebuild -list -json -workspace "$WORKSPACE")
          echo "$LIST_JSON"
          SCHEME=$(printf '%s' "$LIST_JSON" | node -e "
            let d='';
            process.stdin.on('data',c=>d+=c).on('end',()=>{
              const j=JSON.parse(d);
              const w=j.workspace || Object.values(j).find(v=>v && Array.isArray(v.schemes));
              const schemes=w?.schemes || [];
              const appScheme=schemes.find(x=>x==='VeraBrowser') || schemes.find(x=>x==='Vera');
              if (!appScheme) {
                console.error('Could not find VeraBrowser app scheme. Available schemes: '+schemes.join(', '));
                process.exit(2);
              }
              console.log(appScheme);
            });
          ")
          echo "Building Vera app with workspace $WORKSPACE and scheme $SCHEME"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found in ios/build/Build/Products/Release-iphoneos"
            find ios/build -type d -name '*.app' -print || true
            exit 1
          fi
          rm -rf Payload Vera-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qr Vera-unsigned.ipa Payload
          test -s Vera-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Vera-iOS
          path: |
            Vera-unsigned.ipa
            assets/icon.png
          if-no-files-found: error
          retention-days: 7

  create-release:
    name: Publish Vera iOS release
    runs-on: ubuntu-latest
    needs: [build-ios]
    if: ${{ needs.build-ios.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - name: Download iOS IPA and icon
        uses: actions/download-artifact@v4
        with:
          name: Vera-iOS
          path: release-files
      - name: Publish Vera IPA release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vera-v1.0.${{ github.run_number }}
          name: Vera v1.0.${{ github.run_number }}
          body: |
            Vera Browser for iPhone and iPad.

            This is an unsigned iOS IPA. Installation requires signing/provisioning through a supported installer.
          prerelease: false
          make_latest: true
          files: |
            release-files/Vera-unsigned.ipa
      - name: Update SideStore source in this repository
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          RELEASE_TAG: vera-v1.0.${{ github.run_number }}
        run: |
          set -euo pipefail
          cp release-files/icon.png assets/icon.png
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('app.json', 'utf8')).expo;
          const sourcePath = 'sidestore-source.json';
          const source = JSON.parse(fs.readFileSync(sourcePath, 'utf8'));
          const app = source.apps?.[0];
          if (!app) throw new Error('sidestore-source.json must contain apps[0]');
          const build = process.env.BUILD_NUMBER;
          const tag = process.env.RELEASE_TAG;
          const repo = process.env.GITHUB_REPOSITORY;
          const bundle = config.ios?.bundleIdentifier;
          if (!bundle) throw new Error('app.json is missing expo.ios.bundleIdentifier');
          const releasePath = 'https://github.com/' + repo + '/releases/download/' + tag + '/Vera-unsigned.ipa';
          const icon = 'https://raw.githubusercontent.com/' + repo + '/main/assets/icon.png';
          source.name = 'Vera';
          source.description = 'Vera Browser for iPhone and iPad.';
          source.website = 'https://github.com/' + repo;
          source.iconURL = icon;
          app.name = 'Vera';
          app.bundleIdentifier = bundle;
          app.iconURL = icon;
          app.versions = [{
            version: '1.0.' + build,
            buildVersion: Number(build),
            date: new Date().toISOString(),
            localizedDescription: 'Vera Browser for iPhone and iPad.',
            downloadURL: releasePath,
            size: fs.statSync('release-files/Vera-unsigned.ipa').size
          }, ...(app.versions || []).filter(v => Number(v.buildVersion) !== Number(build))];
          fs.writeFileSync(sourcePath, JSON.stringify(source, null, 2) + '\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/icon.png sidestore-source.json
          git commit -m "Publish Vera iOS SideStore source for $RELEASE_TAG"
          git push
